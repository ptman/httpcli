name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Coverage
        run: make coverage

      - name: Vet
        run: make vet

      - name: Cache Go tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Install tools
        run: make tools

      - name: Add Go tools to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          unformatted="$(gofumpt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Not gofumpt-formatted; run 'make gofumpt':"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint
        run: make golangci-lint

      - name: Vulnerabilities
        run: make govulncheck
